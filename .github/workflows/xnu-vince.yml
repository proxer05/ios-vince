name: xnu-vince

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: VINCE
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "tools/patch_dxb.py"
      - ".github/workflows/xnu-vince.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'VINCE' }}

jobs:
  build:
    # macos-14 ships Xcode 15.x whose iig matches the xnu-8796 IORPC ABI
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # Copy Vince-specific and open-source Darwin patches
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # Patch dxb/build.sh: arm64 support for libfirehose and target-aware patch basename loop for Vince
          python3 tools/patch_dxb.py dxb/build.sh
          grep -c 'VALID_ARCHS="arm64"' dxb/build.sh
          ls dxb/patches

      - name: Dependencies
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build XNU Kernel for Vince
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Verify Daisy diagnostics and upstream GPU service in kernel
        if: env.MACHINE_CONFIG == 'VINCE'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          kernel = Path('dxb/fakeroot/System/Library/Kernels') / ('kernel.' + os.environ['KERNEL_CONFIG'].lower() + '.vince')
          data = kernel.read_bytes()
          for marker in (
              b'/usr/sbin/vince-bt.x', b'bluetoothd stand-in %d, cache: %d replaced',
              b'DAISY TOUCH: FT5446 id', b'DAISY TOUCH: report63', b'daisytouch_probe',
              b'DAISY TOUCH: STOP %uK', b'DAISY TOUCH: RESTART %uK',
              b'daisytouch_gpio', b'DAISY TOUCH: GPIO id r', b'DAISY TOUCH: L%u p%x',
              b'daisytouch_power', b'DAISY RPM: power result', b'DAISY TOUCH: RPM r%d rails-ready',
              b'daisytouch_rpm_diag', b'DAISY RPM: layout result', b'DAISY TOUCH: layout-only',
              b'DAISY RPM: mapped item', b'DAISY RPM: snapshot half',
              b'daisytouch_reports', b'DAISY REPORT: begin reg00 bytes63',
              b'DAISY REPORT: seq%u', b'DAISY REPORT: done',
              b'daisytouch_trace', b'DAISY REPORT: trace v1', b'DAISY REPORT: progress',
              b'daisytouch_busywait', b'DAISY TOUCH: delay5',
              b'daisytouch_hid', b'DAISY HID: enabled', b'DAISY HID: drop reason',
              b'daisylog', b'DAISY EMMCLOG: saving console', b'# DAISY EMMCLOG v1',
              b'/private/var/log/daisy-console.log',
              b'VinceGPU: service started and registered', b'VinceGPUUserClient',
              b'VinceGPU: Daisy GEM v1: contiguous DMA32, WC, cache-flush fences',
              b'daisygpu_test', b'VinceGPU: memory test PA=',
              b'adreno: step 8: cleared 32 KiB ring and initialized fence scratch',
              b'SWEET AMFI: backboardd dyld policy flags=',
              b'VinceGPU: IOAcceleratorES discovery service registered',
              b'VinceGPU: IOSurface v1: selector 0x7e, shared DMA32/WC, surface fences',
              b'VinceGPU: import surface=',
              b'SWEET SURF: client-memory v1, BGRA targets, attachments and copy fallback',
              b'SWEET SURF: wrap sel', b'SWEET SURF: DMA allocation failed; cached copy fallback',
              b'daisysurface_copy',
          ):
              if marker not in data:
                  raise SystemExit(f'{kernel}: missing daisy fix marker {marker!r}')
          print(f'{kernel}: Daisy Bluetooth/touch/RPM/eMMC diagnostics and VinceGPU present')
          PY

      - name: Package build tree
        if: always()
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform || true
          ls -la buildtree.tgz || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Collect Output
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-vince
          path: out/
          if-no-files-found: warn
