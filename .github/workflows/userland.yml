name: userland

# iOS arm64 helper programs for the Redmi 5 Plus port (stand-ins and test tools). Each userland/src/NAME.c becomes an
# ad-hoc signed Mach-O vince-NAME in the artifact "userland-bin".
on:
  workflow_dispatch:
  push:
    branches: [main, daisy-boot]
    paths:
      - "userland/**"
      - ".github/workflows/userland.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          mkdir -p out
          for f in userland/src/*.c; do
            n=$(basename "$f" .c)
            n=${n%_stub}
            xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 -isysroot "$SDK" -O2 -fblocks \
              -framework CoreFoundation -Wall -o "out/vince-$n" "$f"
            codesign -f -s - --entitlements userland/ent.plist "out/vince-$n"
            file "out/vince-$n"
            ls -la "out/vince-$n"
          done
          # Build GPU injection helpers
          echo "Building GPU userland helpers..."
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -isysroot "$SDK" -O2 -Wall \
            -o "out/bbd_wrap" userland/gpu/bbd_wrap.c
          codesign -f -s - --entitlements userland/ent.plist "out/bbd_wrap"

          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -isysroot "$SDK" -O2 -Wall \
            -dynamiclib -install_name /daisy/lib/libdaisy-inject.dylib \
            -framework CoreFoundation -framework IOKit \
            -o "out/libdaisy-inject.dylib" userland/gpu/daisy_inject.c
          codesign -f -s - --entitlements userland/ent.plist "out/libdaisy-inject.dylib"

          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -isysroot "$SDK" -O2 -Wall \
            -dynamiclib -install_name /topaz/lib/libtopaz-inject.dylib \
            -framework CoreFoundation -framework IOKit \
            -o "out/libtopaz-inject.dylib" userland/gpu/topaz_inject.c
          codesign -f -s - --entitlements userland/ent.plist "out/libtopaz-inject.dylib"

          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: userland-bin
          path: out/
